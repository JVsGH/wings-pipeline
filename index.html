<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wings Pipeline · Detroit Red Wings prospects</title>
<meta name="description" content="Detroit Red Wings prospect news, NHL-equivalent stats, draft watch and a mock NHL draft lottery.">
<link rel="stylesheet" href="assets/style.css">
<script>
  // Apply the saved light/dark choice (or the system setting) before the page paints.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
</head>
<body data-page="home">
<main>
<section class="hero">
  <h1>Detroit's pipeline, game by game</h1>
  <p class="lede">News, numbers and opinion on every Red Wings prospect, from Grand Rapids to Sweden, Russia and the CHL, plus the draft picks that will join them. <span class="updated" id="home-updated"></span></p>
</section>
<div class="home-grid" id="home-cards"></div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
