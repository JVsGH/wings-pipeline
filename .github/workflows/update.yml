# Every morning: pulls prospect stats, league standings, Central Scouting rankings and traded
# first-round picks, writes recap drafts for new games, rebuilds the post feed, and commits the
# result. GitHub Pages then republishes the site.
name: Update site data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6 AM Eastern (5 AM in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/update_stats.py
      - run: python scripts/build_posts.py
      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data content/drafts
          git diff --cached --quiet || git commit -m "Update site data $(date -u +%F)"
          git push
