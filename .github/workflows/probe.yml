# Temporary: checks which Substack endpoints answer GitHub's runners. Will be deleted after one run.
name: Probe Substack access

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe
        shell: python
        run: |
          import urllib.request
          urls = [
            "https://prospecthockey.substack.com/feed",
            "https://prospecthockey.substack.com/api/v1/posts?limit=5",
            "https://prospecthockey.substack.com/api/v1/archive?sort=new&limit=5",
            "https://upsidehockey.substack.com/feed",
            "https://substack.com/api/v1/publication/prospecthockey/posts?limit=5",
            "https://datawrapper.dwcdn.net/jfQqk/1/dataset.csv",
          ]
          uas = {
            "browser": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36",
            "feedreader": "Mozilla/5.0 (compatible; WingsPipeline/1.0; +https://jvsgh.github.io/wings-pipeline/)",
            "feedly": "Feedly/1.0 (+http://www.feedly.com/fetcher.html; like FeedFetcher-Google)",
            "python": None,
          }
          for u in urls:
            for name, ua in uas.items():
              headers = {"Accept": "application/rss+xml, application/json, text/csv, */*"}
              if ua: headers["User-Agent"] = ua
              try:
                with urllib.request.urlopen(urllib.request.Request(u, headers=headers), timeout=20) as r:
                  print(f"{r.status} {len(r.read()):>8}  {name:<10} {u}")
              except Exception as e:
                print(f"ERR {str(e)[:40]:<40} {name:<10} {u}")
